[tools]
# backend
elixir = "1.20"
erlang = "29"
# frontend
bun = "latest"
# proxy
caddy = "2"
# tooling
lefthook = "2"

##### Required for all contributors #####

[tasks."githook:install"]
run = "lefthook install"

##### Convenience #####

[tasks.precommit]
depends = ["detect-secrets", "web:lint", "web:format", "api:format"]

[tasks.dev]
depends = ["web:dev", "api:dev", "caddy:dev"]


##### DB #####
[tasks."db:start"]
run = "docker compose -f docker/db-compose.yaml up -d"

[tasks."db:setup"]
depends = ["db:start"]
dir = "api"
run = "mix setup"

[tasks."db:reset"]
depends = ["db:start"]
dir = "api"
run = "mix db.reset"

[tasks."db:psql"]
run = "docker compose -f docker/db-compose.yaml exec -it db psql -U postgres -d bubbli_dev"

##### Backend #####
[tasks."api:dev"]
depends = ["db:setup"]
dir = "api"
run = "mix phx.server"

[tasks."api:format"]
dir = "api"
run = "mix format"

##### Frontend #####
[tasks."web:dev"]
dir = "web"
run = "bun run dev"

[tasks."web:lint"]
dir = "web"
run = "bun run lint"

[tasks."web:format"]
dir = "web"
run = "bun run format"

##### Accessories #####
[tasks."caddy:dev"]
run = "caddy run --config Caddyfile.dev"

[tasks."devex:dev"]
run = "docker-compose -f docker/devex-compose.yaml up -d"

[tasks."detect-secrets"]
run = "git diff --staged --name-only -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline"
